[package]
name = "gui"
version = "1.0.2"
description = "ZeroG by ReggieSoft - seamless mouse and keyboard sharing across multiple computers"
authors = ["ReggieSoft"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ZeroG"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "11211c30e71796cd737280303244552bb7f70797" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
ctrlc = { version = "3.5", features = ["termination"] }
tokio = { workspace = true }
mouse-thing = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }
